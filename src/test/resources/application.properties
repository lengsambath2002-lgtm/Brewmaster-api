spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:3000

# S3/Supabase test stubs — the bean must construct, but tests don't upload.
supabase.url=https://test.supabase.local
supabase.s3.endpoint=https://test.supabase.local/storage/v1/s3
supabase.s3.region=us-east-1
supabase.s3.access-key=test-access
supabase.s3.secret-key=test-secret
supabase.s3.bucket=test-bucket
